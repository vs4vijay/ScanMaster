[project]
name = "scanmaster"
version = "0.1.0"
description = "Security-scanning orchestrator for authorized targets"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
scanmaster = "scanmaster.entrypoints.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
addopts = "--cov=scanmaster --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/scanmaster/__main__.py",
    "src/scanmaster/application/errors.py",
    "src/scanmaster/ports/progress.py",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["core", "scanners", "main.py", "test-nexpose.py", "test-openvas.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["scanmaster"]
