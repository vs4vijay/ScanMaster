name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: curl -LsSf https://astral.sh/uv/0.8.3/install.sh | sh
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Dependency audit
        run: uv tool run --from pip-audit==2.9.0 pip-audit
      - name: Build non-root image
        run: docker build --tag scanmaster:test .
      - name: Verify non-root execution
        run: docker run --rm scanmaster:test --version
      - name: Generate SBOM
        run: docker sbom --format cyclonedx-json scanmaster:test > scanmaster-sbom.json
      - name: Scan image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: scanmaster:test
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-and-sbom
          path: |
            dist/
            scanmaster-sbom.json
